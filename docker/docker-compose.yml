services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on: [api]
    networks: [internal]

  api:
    build: { context: ../api, dockerfile: ../docker/api.Dockerfile }
    env_file: ../api/.env.docker
    volumes:
      - storage:/var/www/storage/app
    depends_on: [db, ml]
    networks: [internal]
    # no `ports:` — reachable only from nginx on the internal bridge

  ml:
    build: ../ml
    environment:
      ML_DATABASE_URL: mysql+pymysql://halaqtna_ml:${ML_DB_PASSWORD}@db:3306/halaqtna
      ML_MODEL_PATH: /srv/model/model.joblib
    volumes:
      - storage:/srv/model
    depends_on: [db]
    networks: [internal]
    # no `ports:` — port 8000 is never published outside the host

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: halaqtna
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
    networks: [internal]
    # no `ports:`

volumes:
  storage:
  db_data:

networks:
  internal:
    driver: bridge
