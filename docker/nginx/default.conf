server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;   # NFR4

    root /usr/share/nginx/html;
    index index.html;

    # React SPA (student dashboard + admin console)
    location / {
        try_files $uri /index.html;
    }

    # FR21 / UC26 — the public progress card is rendered by Laravel, not by the SPA,
    # so that it carries its own noindex meta tag and a real 404 for a dead token.
    location /p/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        add_header         X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Laravel API — the only upstream reachable from outside
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    # ml:8000 and db:3306 are intentionally NOT proxied.
}
