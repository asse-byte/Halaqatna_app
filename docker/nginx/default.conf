server {
    listen 80;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;   # NFR4

    # Reports and rosters are small; nothing legitimate posts more than this.
    client_max_body_size 2m;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for every response. nginx drops server-level add_header lines in any
    # location that declares its own, so each location below includes this file instead.
    include /etc/nginx/conf.d/security-headers.inc;

    # React SPA (student dashboard + admin console)
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        try_files $uri /index.html;
    }

    # FR21 / UC26 — the public progress card is rendered by Laravel, not by the SPA,
    # so that it carries its own noindex meta tag and a real 404 for a dead token.
    location /p/ {
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/proxy-to-api.inc;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Laravel API — the only upstream reachable from outside
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        include /etc/nginx/conf.d/proxy-to-api.inc;
        proxy_read_timeout 60s;
    }
    # ml:8000 and db:3306 are intentionally NOT proxied.
}
