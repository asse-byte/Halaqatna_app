<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F1E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121517" media="(prefers-color-scheme: dark)" />
    <title>Halaqtna · حلقتنا</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable app (PWA): the manifest, the home-screen icon iOS reads, and its title there. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="حلقتنا" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Theme and direction before the first paint, so a dark or English page never flashes light/RTL. -->
    <script>
      try {
        if (localStorage.getItem("halaqtna_theme") === "dark") document.documentElement.classList.add("dark");
        if (localStorage.getItem("halaqtna_locale") === "en") { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
      } catch (e) { /* storage blocked: the app applies both once it mounts */ }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
